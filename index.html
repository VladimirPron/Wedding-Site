</head>

<body>

        <h1 id="question"></h1>
        <button class="answer"></button>
        <button class="answer"></button>
        <div id="errorMessage" class="error-message">
            <h2>Не совсем! 😏</h2>
            <p>Давай попробуем ещё раз.</p>
            <button id="tryAgain">
                Попробовать ещё раз

            <p id="finalQuestion"></p>
            <input type="text" id="finalQuestionAnswer" placeholder="Введите ответ">
            <button id="finalQuestionAnswerSubmit">Ответить</button>
            <p class="error-message">Неправильный ответ</p>
        </div>
